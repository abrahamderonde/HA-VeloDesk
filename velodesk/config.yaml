name: "VeloDesk"
description: "Self-hosted cycling training platform with Garmin sync, PMC, power curves, FTP estimation and AI workout planning"
version: "0.5.2"
services:
  - mqtt:want
slug: "velodesk"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
ports:
  8088/tcp: 8088
ports_description:
  8088/tcp: "Web Dashboard"
map:
  - config:rw
  - share:rw
options:
  garmin_email: ""
  garmin_password: ""
  anthropic_api_key: ""
  athlete_weight_kg: 70
  ftp_initial: 200
schema:
  garmin_email: str
  garmin_password: str
  anthropic_api_key: str
  athlete_weight_kg: int
  ftp_initial: int
panel_icon: mdi:bike-fast
panel_title: "Training"
homeassistant_api: true
ingress: true
ingress_port: 8088
